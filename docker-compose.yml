version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: thirdeye-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: thirdeye
      POSTGRES_PASSWORD: thirdeye
      POSTGRES_DB: thirdeye
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U thirdeye" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: thirdeye-rabbitmq
    ports:
      - "5672:5672" # AMQP protocol port (used by amqplib)
      - "15672:15672" # Management Web UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: thirdeye
      RABBITMQ_DEFAULT_PASS: thirdeye
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
